<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>IBUI-001 · Intent-Based-UI</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#f5f5f5}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
button,input{font:inherit}button{cursor:pointer}
.shell{width:min(100%,720px);min-height:min(84dvh,760px);background:#242424;border-radius:36px;padding:34px 32px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:clamp(21px,4vw,30px);font-weight:650;letter-spacing:-.04em}
.menu{color:#8d8d8d;font-size:24px;line-height:1;background:none;border:0;padding:8px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;padding:0 0 5vh}
h1{text-align:center;font-size:clamp(30px,5vw,46px);letter-spacing:-.045em;line-height:1.15;margin:0;font-weight:650}
.entry{display:flex;align-items:center;gap:14px;border:2px solid #3b3b3b;border-radius:32px;padding:12px 16px;min-height:72px}
.entry:focus-within{border-color:#aaa}
.entry input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:clamp(15px,2.6vw,20px)}
.entry input::placeholder{color:#8d8d8d}
.search-icon{font-size:24px;color:#999;line-height:1}
.mic{border:0;background:transparent;color:#eee;font-size:23px;padding:4px;opacity:.5;cursor:not-allowed}
.bubbles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.bubble{background:#2d2d2d;border:1px solid transparent;color:#f3f3f3;border-radius:999px;padding:14px 21px;font-size:clamp(14px,2.6vw,18px);opacity:0;transform:translateY(14px) scale(.96);animation:appear 480ms cubic-bezier(.2,.7,.2,1) forwards;transition:background 180ms ease,border-color 180ms ease,transform 180ms ease}
.bubble:nth-child(1){animation-delay:240ms}.bubble:nth-child(2){animation-delay:440ms}
.bubble:hover{background:#383838;border-color:#555}.bubble:active{transform:scale(.98)}
button:focus-visible,input:focus-visible{outline:2px solid #ddd;outline-offset:4px}
.feedback{min-height:22px;text-align:center;color:#aaa;font-size:14px}
@keyframes appear{to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){body{padding:0}.shell{min-height:100dvh;border-radius:0;padding:28px 20px}main{gap:30px}.entry{min-height:64px}.bubbles{gap:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bubble{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">Mi Taller</div><button class="menu" type="button" aria-label="Menú no disponible en este prototipo" title="Menú no disponible" disabled>☰</button></header>
<main>
<h1>¿Qué quieres hacer?</h1>
<div class="entry"><span class="search-icon" aria-hidden="true">⌕</span><input id="intent" aria-label="Describe tu tarea" placeholder="Escribe o describe tu tarea..." autocomplete="off"><button class="mic" type="button" disabled title="Voz pendiente de implementación" aria-label="Entrada por voz aún no disponible">♩</button></div>
<div class="bubbles" role="group" aria-label="Intenciones sugeridas">
<button class="bubble" type="button" data-intent="Ver catálogo de productos">Ver catálogo de productos</button>
<button class="bubble" type="button" data-intent="Crear pedido">Crear pedido</button>
</div>
<div class="feedback" id="feedback" role="status" aria-live="polite"></div>
</main>
</div>
<script>
const input=document.getElementById('intent'),feedback=document.getElementById('feedback');
function choose(intent){input.value=intent;feedback.textContent='Intención seleccionada · El siguiente paso se diseñará después.';input.focus()}
document.querySelectorAll('[data-intent]').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.intent)));
input.addEventListener('input',()=>feedback.textContent='');
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();feedback.textContent=input.value.trim()?'Intención recibida · Flujo pendiente de diseño.':''}});
</script>
</body>
</html>
