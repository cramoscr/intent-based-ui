<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBUI-001 · Prototipo</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#252a32;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:660px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;font-weight:650}button,input{font:inherit}button{cursor:pointer;border:1px solid #d6dbe2;border-radius:12px;background:#fff;padding:10px 14px;color:#252a32}button:focus-visible,input:focus-visible{outline:3px solid #5578a7;outline-offset:2px}.active,.primary{background:#293c57;color:white;border-color:#293c57}main{margin-top:12vh}.eyebrow{font-size:12px;color:#657181;text-transform:uppercase;letter-spacing:.1em}h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.03em}p{line-height:1.6}.entry{display:flex;gap:8px}.entry input{min-width:0;flex:1;border:1px solid #ccd3dc;border-radius:12px;padding:14px;background:white}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.panel{background:#fff;border:1px solid #e0e4e9;border-radius:18px;padding:22px;margin-top:22px}.field{display:block;margin:14px 0}.field input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #cbd3dd;border-radius:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.muted{color:#667383;font-size:14px}.warning{font-size:13px;color:#745c27}.hidden{display:none}footer{margin-top:50px;font-size:12px;color:#667383}@media(max-width:500px){main{margin-top:9vh}.entry{flex-direction:column}}
</style>
</head>
<body><div class="shell"><header><span>Intent-Based-UI <small>· IBUI-001</small></span><div><button id="taller" class="active" aria-pressed="true">Taller</button> <button id="tienda" aria-pressed="false">Tienda</button></div></header>
<main><div class="eyebrow">Prototipo experimental · sin conexión a producción</div><h1>¿Qué quieres hacer?</h1><p class="muted">Describe una tarea. La interfaz mostrará solo lo necesario.</p>
<form id="intentForm" class="entry"><input id="intent" aria-label="Describe tu intención" autocomplete="off" placeholder="Por ejemplo: Crear pedido para Marvin" required><button class="primary" type="submit">Continuar</button></form>
<div class="suggestions"><button id="suggest1" type="button">Crear pedido para Marvin</button><button id="suggest2" type="button">Buscar cirio pascual</button></div>
<section id="panel" class="panel hidden" aria-live="polite"></section>
</main><footer>Demostración local: datos ficticios, sin IA, voz ni escrituras de negocio. <button id="reset" type="button">Reiniciar</button></footer></div>
<script>
const $=id=>document.getElementById(id);let mode="taller",step="idle",draft={};const catalog=["Cirio pascual 10 x 80 cm","Cirio pascual 8 x 60 cm","Cirio decorativo pequeño"];
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setMode(m){mode=m;step="idle";draft={};$("taller").classList.toggle("active",m==="taller");$("tienda").classList.toggle("active",m==="tienda");$("taller").setAttribute("aria-pressed",m==="taller");$("tienda").setAttribute("aria-pressed",m==="tienda");$("intent").placeholder=m==="taller"?"Por ejemplo: Crear pedido para Marvin":"Por ejemplo: Buscar cirio pascual";$("suggest1").hidden=m!=="taller";$("suggest2").hidden=m!=="tienda";$("panel").classList.add("hidden");$("intent").value="";}
function show(s){$("panel").classList.remove("hidden");$("panel").innerHTML=s;}
function interpret(raw){const t=raw.trim();if(!t)return;draft={};if(mode==="taller"&&/pedido/i.test(t)){draft.customer=(t.match(/para\s+(.+)$/i)||[])[1]||"";step="order";render();}else if(mode==="tienda"&&/(buscar|cirio|producto)/i.test(t)){draft.query=t.replace(/^buscar\s+/i,"").trim();step="search";render();}else{step="unknown";show('<h2>No estoy seguro de la tarea</h2><p>Prueba con una de las sugerencias de '+safe(mode)+'.</p>');}}
function render(){if(step==="order"){show('<h2>Crear pedido</h2><p class="muted">Completa únicamente los datos que faltan.</p><label class="field">Cliente<input id="customer" value="'+safe(draft.customer||"")+'"></label><label class="field">Producto<input id="product" placeholder="Cirio pascual 10 x 80 cm"></label><label class="field">Cantidad<input id="qty" type="number" min="1" step="1" value="1"></label><div class="actions"><button class="primary" id="review">Revisar pedido</button><button id="cancel">Cancelar</button></div>');$("review").onclick=()=>{const c=$("customer").value.trim(),p=$("product").value.trim(),q=Number($("qty").value);if(!c||!p||!Number.isInteger(q)||q<1){alert("Completa cliente, producto y cantidad válida.");return;}draft={customer:c,product:p,qty:q};step="review";render()};$("cancel").onclick=reset;}
else if(step==="review"){show('<h2>Revisar pedido</h2><p><strong>Cliente:</strong> '+safe(draft.customer)+'</p><p><strong>Producto:</strong> '+safe(draft.product)+'</p><p><strong>Cantidad:</strong> '+draft.qty+'</p><p class="warning">La confirmación es simulada. No se guardarán datos.</p><div class="actions"><button class="primary" id="confirm">Confirmar simulación</button><button id="back">Editar</button><button id="cancel">Cancelar</button></div>');$("confirm").onclick=()=>{step="done";render()};$("back").onclick=()=>{step="order";render();$("product").value=draft.product;$("qty").value=draft.qty};$("cancel").onclick=reset;}
else if(step==="done"){show('<h2>Simulación completada</h2><p>El pedido no fue almacenado. Este resultado demuestra únicamente el flujo de interacción.</p><button id="again">Nueva tarea</button>');$("again").onclick=reset;}
else if(step==="search"){const q=(draft.query||"").replace(/^productos?\s*/i,"");const terms=q.toLowerCase().split(/\s+/).filter(x=>x&&x!=="un");const found=catalog.filter(p=>terms.every(x=>p.toLowerCase().includes(x)));show('<h2>Resultados de productos</h2><p class="muted">Catálogo ficticio de demostración.</p><label class="field">Búsqueda<input id="query" value="'+safe(q)+'"></label><div id="results">'+(found.length?found.map(x=>'<p>• '+safe(x)+'</p>').join(""):'<p>No hay coincidencias. Ajusta tu búsqueda.</p>')+'</div><div class="actions"><button id="refine" class="primary">Buscar de nuevo</button><button id="cancel">Cancelar</button></div>');$("refine").onclick=()=>{draft.query=$("query").value;render()};$("cancel").onclick=reset;}}
function reset(){step="idle";draft={};$("panel").classList.add("hidden");$("intent").value="";$("intent").focus()}
$("intentForm").onsubmit=e=>{e.preventDefault();interpret($("intent").value)};$("taller").onclick=()=>setMode("taller");$("tienda").onclick=()=>setMode("tienda");$("suggest1").onclick=()=>interpret("Crear pedido para Marvin");$("suggest2").onclick=()=>interpret("Buscar cirio pascual");$("reset").onclick=reset;setMode("taller");
</script></body></html>
