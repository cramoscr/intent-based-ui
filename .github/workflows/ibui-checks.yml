name: IBUI checks

on:
  push:
    paths:
      - 'software/app/**'
      - '.github/workflows/ibui-checks.yml'
  pull_request:
    paths:
      - 'software/app/**'
      - '.github/workflows/ibui-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: software/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
