name: IBUI Firebase Hosting CD

on:
  push:
    branches:
      - main
    paths:
      - .github/trigger-ci-cd
      - .github/workflows/ibui-hosting-cd.yml
      - software/app/**

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: ibui-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: software/app/package-lock.json

      - name: Install dependencies
        working-directory: software/app
        run: npm ci

      - name: Build
        working-directory: software/app
        run: npm run build

      - name: Wait for real public catalog API
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://us-central1-cirios-app.cloudfunctions.net/publicCatalogApi" \
              | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.products))process.exit(1)})'; then
              echo "Real catalog API is available"
              exit 0
            fi
            echo "Catalog not ready yet ($attempt/20)"
            sleep 15
          done
          echo "Catalog API not available: aborting IBUI deployment"
          exit 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: fabricamelo-lab
          workload_identity_provider: ${{ vars.IBUI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.IBUI_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy only IBUI Hosting target
        working-directory: software/app
        run: npx --yes firebase-tools deploy --only hosting:ibui --project fabricamelo-lab --non-interactive

      - name: Publish CI/CD status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE="failure"
          if [ "$JOB_STATUS" = "success" ]; then STATE="success"; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context="IBUI Firebase Hosting CD" \
            -f description="CI/CD $STATE"
